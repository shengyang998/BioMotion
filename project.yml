name: BioMotion
options:
  bundleIdPrefix: com.soleil
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"

settings:
  base:
    # The reproducible Nimble and OSQP simulator archives are arm64-only.
    # Pin the whole target graph so a generic Simulator build cannot add an
    # unsupported x86_64 link slice behind the app target's back.
    "ARCHS[sdk=iphonesimulator*]": arm64

targets:
  BioMotion:
    type: application
    platform: iOS
    sources:
      # `CoreML/` holds the 1.3 GB SAM3DBodyPose.mlpackage. It is DELIBERATELY
      # excluded: the model now ships as an Apple-Hosted Managed Background
      # Assets pack (see tools/assetpack/README.md), not inside the app binary.
      # Re-adding it here re-inflates the download by ~1.31 GiB.
      #
      # `AssetPack/Downloader` and `AssetPack/Support` belong to the extension
      # target below. The Downloader source declares its own `@main`, so
      # compiling it into the app too is a hard build error.
      - path: BioMotion
        excludes:
          - "CoreML/**"
          - "CoreML"
          # Resource membership is an explicit shipping allowlist below. The
          # source tree also contains authority/license documents that belong
          # in source control or the managed asset pack, not the app root.
          - "Resources/**"
          - "Resources"
          - "**/*.md"
          - "AssetPack/Downloader/**"
          - "AssetPack/Downloader"
          - "AssetPack/Support/**"
          - "AssetPack/Support"
          # Assigned explicitly below so XcodeGen cannot infer two resource
          # memberships from the broad source root.
          - "PrivacyInfo.xcprivacy"
      - path: BioMotion/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: BioMotion/Resources/FullBody.osim
        buildPhase: resources
      - path: BioMotion/Resources/Rajagopal2016.osim
        buildPhase: resources
      # Complete selected binary-redistribution terms for every currently
      # linked native dependency. The resource probe pins its identity.
      - path: BioMotion/Resources/THIRD-PARTY-NOTICES.txt
        buildPhase: resources
      # Apache/OpenSim attribution required by this binary distribution.
      # This is notice compliance, not a grant of commercial model rights;
      # STATUS.md records the separate FullBody licence blocker.
      - path: NOTICE
        buildPhase: resources
      # Developer-only escape hatch. Absent by default (hence `optional`), so a
      # normal build/archive carries no model. Populate it from the canonical,
      # receipt-verified AAR to get a bundled precompiled
      # `SAM3DBodyPose.mlmodelc` that
      # `AssetPackModelStore.resolveCompiledModelURL()` prefers over the asset
      # pack — required for the Simulator, where Background Assets serves no
      # packs:
      #   /bin/bash -p tools/assetpack/dev_bundle_model.sh on   (then xcodegen generate)
      #   /bin/bash -p tools/assetpack/dev_bundle_model.sh off  (then xcodegen generate)
      # It lives under build/ because .gitignore already covers that — a 1.3 GiB
      # copy must never be committable by accident. The helper never accepts or
      # compiles a raw `.mlpackage`.
      - path: build/DevBundledModel
        optional: true
    preBuildScripts:
      # `optional` is evaluated when XcodeGen runs, not per configuration. A
      # developer model that was enabled for Simulator work must therefore be
      # rejected before every non-Debug build rather than relying on memory.
      - path: tools/release/reject_dev_model.sh
        name: Reject developer model before non-Simulator build
        shell: /bin/bash
        showEnvVars: false
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Re-run after Copy Resources. This closes the interval between the
      # pre-build source check and resource copying if another process toggles
      # the developer bundle while a non-Simulator build is compiling.
      - path: tools/release/reject_dev_model.sh
        name: Reject bundled model after resources
        shell: /bin/bash
        showEnvVars: false
        basedOnDependencyAnalysis: false
    dependencies:
      - target: AssetPackDownloader   # embeds the Background Download extension
    settings:
      base:
        INFOPLIST_FILE: BioMotion/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.soleil.BioMotion
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "N7VVB6PWZS"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "30"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BioMotion/AssetPack/Support/BioMotion.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: BioMotion/Nimble/BioMotion-Bridging-Header.h
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(PROJECT_DIR)/nimblephysics"
          - "$(PROJECT_DIR)/nimblephysics/third_party/eigen"
          - "$(PROJECT_DIR)/nimblephysics/third_party/tinyxml2"
          - "$(PROJECT_DIR)/osqp/include/public"
          - "$(PROJECT_DIR)/osqp/include/private"
          # Tracked source roots precede ignored build roots. The dependency
          # gate inventories the latter and permits only dart/config.hpp.
          - "$(PROJECT_DIR)/nimblephysics/build_ios"
          - "$(PROJECT_DIR)/osqp/build_ios/include/public"
        "HEADER_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(PROJECT_DIR)/nimblephysics"
          - "$(PROJECT_DIR)/nimblephysics/third_party/eigen"
          - "$(PROJECT_DIR)/nimblephysics/third_party/tinyxml2"
          - "$(PROJECT_DIR)/osqp/include/public"
          - "$(PROJECT_DIR)/osqp/include/private"
          # Same ordering and generated-header inventory for Simulator.
          - "$(PROJECT_DIR)/nimblephysics/build_sim"
          - "$(PROJECT_DIR)/osqp/build_sim/include/public"
        # Name-based `-lfoo` lookup prefers an unreviewed same-name dylib over
        # a static archive. Link the exact device/simulator archives whose
        # bytes are pinned by tools/dependencies.lock.json instead.
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - "$(PROJECT_DIR)/nimblephysics/build_ios/libnimble_ios.a"
          - "$(PROJECT_DIR)/osqp/build_ios/out/libosqpstatic.a"
          - "-lc++"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]":
          - "$(PROJECT_DIR)/nimblephysics/build_sim/libnimble_ios.a"
          - "$(PROJECT_DIR)/osqp/build_sim/out/libosqpstatic.a"
          - "-lc++"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "DART_IOS_BUILD=1"
          - "DART_USE_IDENTITY_JACOBIAN=1"
          - "EIGEN_DONT_PARALLELIZE=1"
          # Make accidental inclusion of Eigen's non-MPL2 headers a compile
          # error. The pinned native-library CMake target mirrors this flag.
          - "EIGEN_MPL2_ONLY=1"
      configs:
        Debug:
          # Compiles the zero-external-force and unconstrained near-CoP
          # selectors used by numerical characterization tests. Release omits
          # both implementations, so they cannot be invoked dynamically from
          # the shipped app binary.
          GCC_PREPROCESSOR_DEFINITIONS:
            - "DART_IOS_BUILD=1"
            - "DART_USE_IDENTITY_JACOBIAN=1"
            - "EIGEN_DONT_PARALLELIZE=1"
            - "EIGEN_MPL2_ONLY=1"
            - "BIOMOTION_TEST_DIAGNOSTICS=1"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BIOMOTION_INTERNAL_UI"
        Release:
          # A release archive must be signed as an App Store distribution,
          # not with Xcode's default Apple Development identity. These two
          # checked profile names authorize the reviewed Background Assets app
          # group and are independently cross-checked by the archive gate.
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "BioMotion AppStore AG"
    info:
      path: BioMotion/Info.plist
      properties:
        # XcodeGen regenerates Info.plist on every run and defaults
        # CFBundleVersion to "1" unless it is mapped here. Without these two
        # lines, bumping CURRENT_PROJECT_VERSION below has no effect on the
        # archive and App Store Connect rejects the upload as a duplicate
        # build number.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSCameraUsageDescription: "BioMotion needs camera access for real-time body tracking and motion analysis."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Apple-Hosted Managed Background Assets (iOS 26). These three keys are
        # the only ones permitted in Apple-hosted mode — adding any of the
        # self-hosting keys (BAManifestURL, BADownloadAllowance…) makes the
        # build's Background Assets configuration invalid.
        BAUsesAppleHosting: true
        BAHasManagedAssetPacks: true
        BAAppGroupID: group.com.soleilyu.biomotion

  # Background Download extension. The system, not the app, drives asset-pack
  # downloads; this extension exists so the OS has an in-app policy hook and so
  # `prefetch` at install time is honoured. Apple's Managed Background Assets
  # setup requires it ("Add a managed Background Download extension to your
  # project"), even though the app also drives an explicit
  # `ensureLocalAvailability`.
  AssetPackDownloader:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: BioMotion/AssetPack/Downloader
    info:
      path: BioMotion/AssetPack/Support/AssetPackDownloader-Info.plist
      properties:
        CFBundleDisplayName: "Model Downloader"
        # Must track the containing app or the upload warns ITMS-90473.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soleil.BioMotion.AssetPackDownloader
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "N7VVB6PWZS"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "30"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BioMotion/AssetPack/Support/AssetPackDownloader.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "BioMotion Ext AppStore AG"

  BioMotionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # `Fixtures/` holds generated plain-text clip data, not code. Excluded
      # here and re-added below as a FOLDER reference, which is load-bearing:
      # copied flat, a `.txt` at the root of the shallow .xctest bundle makes
      # codesign treat it as an unsigned nested code object and the whole test
      # run dies with "code object is not signed at all". Inside a directory it
      # seals as a normal resource. Look it up with
      # `Bundle.url(forResource:withExtension:subdirectory: "Fixtures")`.
      - path: BioMotionTests
        excludes:
          - "Fixtures/**"
          - "Fixtures"
      - path: BioMotionTests/Fixtures
        type: folder
        buildPhase: resources
      - path: BioMotion/Resources/FullBody.osim
        buildPhase: resources
      - path: BioMotion/Resources/Rajagopal2016.osim
        buildPhase: resources
    dependencies:
      - target: BioMotion
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
        # Exposes the legacy unconstrained near-CoP selector only inside the
        # test module. The app bridging header intentionally omits it.
        SWIFT_OBJC_BRIDGING_HEADER: BioMotionTests/BioMotionTests-Bridging-Header.h
        # Permanent ObjC++ geometry and observability regressions call the
        # vendored C++17 nimblephysics surface directly.
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(PROJECT_DIR)/BioMotion/Nimble"
          # MusclePathWrapTests.mm calls the ported cylinder wrap solver
          # directly, so the geometry is unit-tested without a skeleton.
          - "$(PROJECT_DIR)/BioMotion/Muscle"
          - "$(PROJECT_DIR)/nimblephysics"
          - "$(PROJECT_DIR)/nimblephysics/third_party/eigen"
          - "$(PROJECT_DIR)/nimblephysics/third_party/tinyxml2"
          - "$(PROJECT_DIR)/nimblephysics/build_ios"
        "HEADER_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(PROJECT_DIR)/BioMotion/Nimble"
          # MusclePathWrapTests.mm calls the ported cylinder wrap solver
          # directly, so the geometry is unit-tested without a skeleton.
          - "$(PROJECT_DIR)/BioMotion/Muscle"
          - "$(PROJECT_DIR)/nimblephysics"
          - "$(PROJECT_DIR)/nimblephysics/third_party/eigen"
          - "$(PROJECT_DIR)/nimblephysics/third_party/tinyxml2"
          - "$(PROJECT_DIR)/nimblephysics/build_sim"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "DART_IOS_BUILD=1"
          - "DART_USE_IDENTITY_JACOBIAN=1"
          - "EIGEN_DONT_PARALLELIZE=1"
          - "EIGEN_MPL2_ONLY=1"
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - "$(PROJECT_DIR)/nimblephysics/build_ios/libnimble_ios.a"
          - "-lc++"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]":
          - "$(PROJECT_DIR)/nimblephysics/build_sim/libnimble_ios.a"
          - "-lc++"
